name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce utility contract
        run: ./summon/main lint
      - name: Lint rule coverage (negative fixtures)
        run: ./summon/test

  code-review-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # >= 24: the coordinator's bin entry is `node ./cli.ts`, run through
      # Node's built-in type stripping rather than a build step.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # Names no utility: every plugins/*/skills/*/test.sh runs. Adding a
      # utility with tests needs no edit here.
      - name: Test every utility that ships tests
        run: |
          found=0
          for t in plugins/*/skills/*/test.sh; do
            [ -x "$t" ] || continue
            found=1
            echo "::group::$t"
            "$t"
            echo "::endgroup::"
          done
          [ "$found" = 1 ] || echo "no utility test suites found"

  permission-sieve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/stacia/permission-sieve
      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y liblua5.4-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build
        run: cargo build --release --manifest-path plugins/stacia/permission-sieve/Cargo.toml
      - name: Test (includes startup SLA)
        run: cargo test --manifest-path plugins/stacia/permission-sieve/Cargo.toml
      - name: Sieve rule tests
        run: python3 plugins/stacia/permission-sieve/tests/test_sieve_rules.py -v

  commit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PR title (Conventional Commits)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s' "$PR_TITLE" | ./summon/main commit-lint -
