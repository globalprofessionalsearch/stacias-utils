name: CI

on:
  push:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce utility contract
        run: ./summon/main lint
      - name: Lint rule coverage (negative fixtures)
        run: ./summon/test

  # Both code-review trees are tested while the pi -> Claude Code port is in
  # flight: the pi extension under extensions/ and the plugin under plugins/
  # exist side by side until the pi version is deleted. Drop the extension leg
  # of the matrix with it.
  code-review-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tree:
          - extensions/stacia-code-review
          - plugins/stacia-code-review
    name: Test ${{ matrix.tree }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run the suite
        run: ./${{ matrix.tree }}/test.sh

  commit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PR title (Conventional Commits)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s' "$PR_TITLE" | ./summon/main commit-lint -
