[package]
name = "permission-sieve"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "dispatcher"
path = "src/main.rs"

[dependencies]
mlua = { version = "0.10", features = ["lua54", "serialize", "vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
shell-words = "1"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "startup"
harness = false
