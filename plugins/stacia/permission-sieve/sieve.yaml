# Permission sieve configuration
#
# Script order does not affect the outcome — the resolution algebra is
# commutative. Deny scripts short-circuit for performance (remaining
# scripts are skipped), but the final allow/deny/uncertain result would
# be the same in any order. Anything not explicitly allowed falls
# through to the summarizer -> ask.

rules:
  - path: rules/deny-dangerous.lua
    description: Hard-deny force push, terraform, gh pr merge

  - path: rules/guard-sensitive-paths.lua
    description: Prompt for .env, .ssh, credentials, key files

  - path: rules/guard-external-dirs.lua
    description: Prompt for mutations outside ~/Documents/code and ~/.cache

  - path: rules/allow-readonly.lua
    description: Auto-approve Read, Grep, Glob, WebSearch and other safe tools

  - path: rules/allow-safe-mutations.lua
    description: Auto-approve Write/Edit within ~/Documents/code and ~/.cache

  - path: rules/allow-safe-bash.lua
    description: Auto-approve safe bash commands (file ops, git, kubectl, helm, tofu, etc.)
